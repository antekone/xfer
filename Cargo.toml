[package]
name = "xfer"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Event-driven terminal transfer client scaffold"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
prost = "0.14"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
tokio-util = "0.7"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
shlex = "2"
url = "2"
serde_json = "1"
aws-smithy-http-client = { version = "1", features = ["hyper-014"] }
# The AWS SDK path keeps its battle-tested hyper 0.14 connector stack under
# distinct names; the native HTTP/WebDAV stack below uses hyper 1.
hyper = { version = "0.14", features = ["client", "tcp"] }
hyper-1 = { package = "hyper", version = "1", features = ["client", "http1"] }

http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls-1 = { package = "hyper-rustls", version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "native-tokio"] }
rustls-1 = { package = "rustls", version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
hyper-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
quick-xml = { version = "0.37", features = ["async-tokio"] }
base64 = "0.22"
tower-service = "0.3"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
libc = "0.2"
openssh-sftp-client = "0.15.10"
smb2 = "0.31"
futures-util = "0.3"
percent-encoding = "2"
tempfile = "3.10"
zeroize = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
hyper = { version = "0.14", features = ["server"] }
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.13"

[patch.crates-io]
openssh-sftp-client = { path = "lib/openssh-sftp-client" }
openssh-sftp-protocol = { path = "lib/openssh-sftp-protocol" }
openssh-sftp-protocol-error = { path = "lib/openssh-sftp-protocol/openssh-sftp-protocol-error" }
