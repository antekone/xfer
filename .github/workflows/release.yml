name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  freebsd:
    uses: ./.github/workflows/freebsd.yml

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (${{ matrix.os }})
    needs: [test, freebsd]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release --locked --bin xfer
      - name: Package binary and manual
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS_NAME" in
            Linux) platform=linux ;;
            macOS) platform=macos ;;
            *) echo "Unsupported runner OS: $RUNNER_OS_NAME" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64 ;;
            arm64|aarch64) arch=aarch64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          name="xfer-${TAG}-${platform}-${arch}"
          mkdir -p "dist/${name}"
          cp target/release/xfer README.md LICENSE "dist/${name}/"
          gzip -n -c docs/xfer.1 > "dist/${name}/xfer.1.gz"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          echo "ARCHIVE=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
      - name: Install PDF manual tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y groff
      - name: Generate PDF manual
        if: runner.os == 'Linux'
        run: groff -Tpdf -man docs/xfer.1 > dist/xfer.1.pdf
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: xfer-manual-pdf
          path: dist/xfer.1.pdf
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: xfer-*
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./xfer.1.pdf > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/xfer.1.pdf
            dist/SHA256SUMS
